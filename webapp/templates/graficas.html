{% extends "base.html" %}

{% block content %}

<h1>
    Gráficas históricas
</h1>

<p class="subtitle">
    Consulta de variables de la cámara de maduración
</p>


<section class="panel">

    <h2>
        Variable
    </h2>

    <div class="variable-buttons">

        <button onclick="consultarCO2()">
            CO₂
        </button>

        <button onclick="consultarTemperatura()">
            Temperatura
        </button>

        <button onclick="consultarHumedad()">
            Humedad
        </button>

        <button onclick="consultarC2H4()">
            Etileno C₂H₄
        </button>

        <button onclick="consultarPT100()">
            PT100
        </button>

        <button onclick="consultarPT1000()">
            PT1000
        </button>

    </div>

</section>


<section class="panel">

    <h2>
        Filtro de tiempo
    </h2>


    <div class="filter-grid">

        <div>

            <label for="fechaDesde">
                Desde
            </label>

            <input
                type="date"
                id="fechaDesde"
            >

        </div>


        <div>

            <label for="horaDesde">
                Hora
            </label>

            <select
                id="horaDesde"
            ></select>

        </div>


        <div>

            <label for="minDesde">
                Minuto
            </label>

            <select id="minDesde">

                <option>00</option>
                <option>10</option>
                <option>20</option>
                <option>30</option>
                <option>40</option>
                <option>50</option>

            </select>

        </div>


        <div>

            <label for="fechaHasta">
                Hasta
            </label>

            <input
                type="date"
                id="fechaHasta"
            >

        </div>


        <div>

            <label for="horaHasta">
                Hora
            </label>

            <select
                id="horaHasta"
            ></select>

        </div>


        <div>

            <label for="minHasta">
                Minuto
            </label>

            <select id="minHasta">

                <option>00</option>
                <option>10</option>
                <option>20</option>
                <option>30</option>
                <option>40</option>
                <option>50</option>

            </select>

        </div>

    </div>


    <div
        style="
            margin-top: 18px;
        "
    >

        <button
            onclick="consultarHistorico()"
        >
            Consultar período
        </button>

    </div>

</section>


<section class="panel">

    <h2 id="tituloGrafica">
        CO₂
    </h2>

    <div id="resultado">
        Seleccione una variable y un período.
    </div>


    <div
        style="
            position: relative;
            width: 100%;
            overflow-x: auto;
        "
    >

        <canvas
            id="graficaCO2"
            width="1200"
            height="420"
        ></canvas>

    </div>

</section>


<div
    id="tooltipGrafica"
    class="chart-tooltip"
></div>


<script src="/static/js/graficas.js"></script>

{% endblock %}
