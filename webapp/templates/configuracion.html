{% extends "base.html" %}

{% block content %}

<h1>Configuración</h1>

<p class="subtitle">
    Parámetros actuales de control de la cámara de maduración
</p>

<section class="panel">

    <h2>Control CO₂</h2>

    <div class="config-grid">

        <div class="config-item">
            <span class="config-label">LOW</span>
            <span id="co2Low" class="config-value">--</span>
        </div>

        <div class="config-item">
            <span class="config-label">HIGH</span>
            <span id="co2High" class="config-value">--</span>
        </div>

        <div class="config-item">
            <span class="config-label">Aire fresco</span>
            <span id="aireFresco" class="config-value">--</span>
        </div>

    </div>

</section>


<section class="panel">

    <h2>Control de humedad</h2>

    <div class="config-grid">

        <div class="config-item">
            <span class="config-label">Humedad LOW</span>
            <span id="humedadLow" class="config-value">--</span>
        </div>

        <div class="config-item">
            <span class="config-label">Humedad HIGH</span>
            <span id="humedadHigh" class="config-value">--</span>
        </div>

    </div>

</section>


<section class="panel">

    <h2>Control HVAC Samsung</h2>

    <p class="subtitle">
        Ajuste de temperatura de la cámara
    </p>

    <div class="config-grid">

        <div class="config-item">

            <label for="tempTarget">
                Temperatura objetivo
            </label>

            <div>
                <input
                    id="tempTarget"
                    type="number"
                    step="0.1"
                    min="16"
                    max="26"
                >
                <span>°C</span>
            </div>

        </div>


        <div class="config-item">

            <label for="tempLow">
                Banda baja
            </label>

            <div>
                <input
                    id="tempLow"
                    type="number"
                    step="0.1"
                    min="16"
                    max="26"
                >
                <span>°C</span>
            </div>

        </div>


        <div class="config-item">

            <label for="tempHigh">
                Banda alta
            </label>

            <div>
                <input
                    id="tempHigh"
                    type="number"
                    step="0.1"
                    min="16"
                    max="26"
                >
                <span>°C</span>
            </div>

        </div>

    </div>


    <div style="margin-top:20px;">

        <button
            type="button"
            id="btnGuardarTemperatura"
            onclick="guardarTemperaturaHVAC()"
        >
            Guardar temperatura
        </button>

        <span
            id="estadoGuardarHVAC"
            style="margin-left:12px;"
        ></span>

    </div>

</section>


<script src="/static/js/configuracion.js?v=20260928-1"></script>

{% endblock %}
