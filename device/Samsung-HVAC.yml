medidores:
  samsung_mim_b19n:
    id: 21
    name: "Samsung MIM-B19N HVAC"
    slave_id: 01
    port: "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0OI4DA-if00-port0"
    #port: "/dev/ttyUSB5"
    baudrate: 9600
    bytesize: 8
    parity: "E"
    stopbits: 1
    timeout: 3
    debug: false
    simular: false

    description: >
      Controlador Modbus RTU Samsung MIM-B19N/MIM-B19NT
      para sistema HVAC del proyecto RPI-MDFR.
    control:
      enabled: true

      # Sensor de referencia para control de cámara
      reference_sensor: "THT03R"

      # Rango deseado del cuarto de banano
      temp_target: 20.0
      temp_low: 19.5
      temp_high: 20.5

      # Límites permitidos del setpoint HVAC
      setpoint_min: 16.0
      setpoint_max: 26.0

      # Control suave
      setpoint_step: 0.5
      
      # Modo recomendado
      mode: 1          # 1=Cool
      fan_speed: 1     # 0=Auto, 1=Low, 2=Medium, 3=High


    variables:

      # ---------------------------------------------------
      # Estado de comunicación
      # ---------------------------------------------------
      - name: Communication status
        alias: comm_status
        address: 50
        fc: 3
        type: uint16
        readWrite: "R"
        unit: 161
        description: "Estado de comunicación de la unidad interior  7 = Ready."
      # ---------------------------------------------------
      # unit type
      # ---------------------------------------------------

      - name: Unit type
        alias: hvac_unit_type
        address: 51
        fc: 3
        type: uint16
        readWrite: "R"
        unit: 206
        description: "Tipo de unidad detectada por Samsung"
      # ---------------------------------------------------
      # Encendido / apagado
      # ---------------------------------------------------
      - name: OnOff
        alias: hvac_onoff
        address: 52
        fc: 3
        fc_write: 6
        type: uint16
        readWrite: "RW"
        unit: 162
        description: "1=ON, 0=OFF"

      # ---------------------------------------------------
      # Modo de operación
      # ---------------------------------------------------
      - name: Operation mode
        alias: hvac_mode
        address: 53
        fc: 3
        fc_write: 6
        type: uint16
        readWrite: "RW"
        unit: 163
        description: "0=Auto, 1=Cool, 2=Dry, 3=Fan, 4=Heat"
        
      # ---------------------------------------------------
      # Velocidad ventilador
      # ---------------------------------------------------
      - name: Fan speed
        alias: hvac_fan_speed
        address: 54
        fc: 3
        fc_write: 6
        type: uint16
        readWrite: "RW"
        unit: 203
        description: "0=Auto, 1=Low, 2=Medium, 3=High"
         
      # ---------------------------------------------------
      # Temperatura de consigna
      # ---------------------------------------------------
      - name: Set temperature
        alias: hvac_setpoint
        address: 58
        fc: 3
        fc_write: 6
        type: int16
        scale: 0.1
        readWrite: "RW"
        unit: 164
        description: >
          Temperatura de consigna del aire acondicionado.
          El valor Modbus se maneja en décimas.
          Ejemplo:
          170 = 17.0 °C
          200 = 20.0 °C

      # ---------------------------------------------------
      # Temperatura ambiente reportada por Samsung
      # ---------------------------------------------------
      - name: Room temperature
        alias: hvac_room_temp
        address: 59
        fc: 3
        type: int16
        scale: 0.1
        readWrite: "R"
        unit: 165
        description: "Temperatura ambiente medida por la unidad interior"

      # ---------------------------------------------------
      # Código de error
      # ---------------------------------------------------
      - name: Error code
        alias: hvac_error_code
        address: 63
        fc: 3
        type: uint16
        readWrite: "R"
        unit: 204
        description: "Código de error reportado por la unidad Samsung"